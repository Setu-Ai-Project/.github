    <rect x="72" y="100" width="56" height="52" rx="16" fill="#6E6D6C" stroke="#303030" stroke-width="5"/>
    <path d="M100 104 L100 148" stroke="#303030" stroke-width="2.5"/>
    <rect x="93" y="88" width="14" height="18" rx="5" fill="#6E6D6C" stroke="#303030" stroke-width="4"/>
