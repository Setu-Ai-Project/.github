    <rect x="103" y="146" width="13" height="22" rx="6.5" fill="#6E6D6C" stroke="#303030" stroke-width="4.5"/>
    <ellipse cx="90.5" cy="170" rx="11" ry="7" fill="#303030" stroke="#303030" stroke-width="4"/>
    <ellipse cx="109.5" cy="170" rx="11" ry="7" fill="#303030" stroke="#303030" stroke-width="4"/>
    <rect x="56" y="108" width="18" height="30" rx="9" fill="#6E6D6C" stroke="#303030" stroke-width="5"/>
    <circle cx="65" cy="140" r="8" fill="#DC6F51" stroke="#303030" stroke-width="4"/>
    <rect x="126" y="108" width="18" height="30" rx="9" fill="#6E6D6C" stroke="#303030" stroke-width="5"/>
