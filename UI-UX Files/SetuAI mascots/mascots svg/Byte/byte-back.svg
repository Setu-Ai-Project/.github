    <rect x="64" y="62" width="12" height="16" rx="6" fill="#DC6F51" stroke="#303030" stroke-width="4.5"/>
    <rect x="124" y="62" width="12" height="16" rx="6" fill="#DC6F51" stroke="#303030" stroke-width="4.5"/>
  </g>
  <g id="body" stroke-linecap="round" stroke-linejoin="round">
