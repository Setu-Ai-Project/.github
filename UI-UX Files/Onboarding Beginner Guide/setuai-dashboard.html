<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="setuai-logo.webp" />
<title>SetuAI — Dashboard preview</title>
<style>
  @font-face { font-family: "Player Sans"; src: url("fonts/PlayerSansMono8x13-Classic.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Player Sans"; src: url("fonts/PlayerSansMono8x13-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
  :root { --cream: #F8F7F1; --ink: #172A32; --coral: #DC6F51; --teal: #85CEC7; --gray: #6E6D6C; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Player Sans", "Player Sans Classic", system-ui, sans-serif;
    background: var(--cream); color: var(--ink); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 40px 16px;
  }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 48px; height: 48px; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); image-rendering: pixelated; background: #fff; }
  header span { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
  main {
    margin-top: 32px; width: 100%; max-width: 448px; background: #fff;
    border: 4px solid var(--ink); border-radius: 24px; padding: 32px;
    box-shadow: 8px 8px 0 var(--ink); text-align: center;
  }
  h1 { font-size: 28px; font-weight: 900; }
  p.sub { margin-top: 8px; font-size: 16px; color: var(--gray); }
  .xp { margin-top: 24px; border: 3px solid var(--ink); background: var(--cream); border-radius: 16px; padding: 16px; }
  .xp p { font-size: 16px; font-weight: 900; }
  .bar { margin-top: 8px; height: 16px; border: 2px solid var(--ink); background: #fff; border-radius: 999px; overflow: hidden; }
  .bar div { height: 100%; width: 0%; background: var(--teal); border-radius: 999px; }
  a.replay { display: inline-block; margin-top: 24px; font-weight: 900; color: var(--coral); text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
  <header>
    <img src="setuai-logo.webp" alt="SetuAI logo" />
    <span>SetuAI</span>
  </header>
  <main>
    <h1>Your dashboard is coming soon</h1>
    <p class="sub">You finished onboarding with 0 XP. Play your first game to earn some!</p>
    <div class="xp">
      <p>Level 1 · 0 XP</p>
      <div class="bar"><div></div></div>
    </div>
    <a class="replay" href="setuai-onboarding.html">Replay the tour</a>
  </main>
</body>
</html>
