<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="setuai-logo.webp" />
<title>SetuAI — The Next Step in AI Literacy</title>
<style>
  :root {
    --cream: #F8F7F1;
    --ink: #172A32;
    --coral: #DC6F51;
    --teal: #85CEC7;
    --gray: #6E6D6C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Player Sans Classic", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    position: relative;
    overflow-x: hidden;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; }
  .blob-teal { left: -96px; top: 40px; width: 288px; height: 288px; background: rgba(133, 206, 199, 0.4); }
  .blob-coral { right: -96px; bottom: 40px; width: 320px; height: 320px; background: rgba(220, 111, 81, 0.25); }
  header { position: relative; z-index: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .logo-img {
    width: 48px; height: 48px; border: 4px solid var(--ink); border-radius: 16px;
    box-shadow: 4px 4px 0 var(--ink); image-rendering: pixelated; display: block;
  }
  .wordmark span.name { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
  .tagline { font-size: 24px; font-style: italic; opacity: 0.8; }
  main {
    position: relative; z-index: 1; margin-top: 32px; width: 100%; max-width: 448px;
    background: #fff; border: 4px solid var(--ink); border-radius: 24px;
    padding: 32px; box-shadow: 8px 8px 0 var(--ink);
  }
  h1 { font-size: 28px; font-weight: 900; line-height: 1.2; }
  .sub { margin-top: 4px; font-size: 16px; color: var(--gray); }
  form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 700; }
  input {
    border: 2px solid rgba(23, 42, 50, 0.2); background: var(--cream); border-radius: 12px;
    padding: 12px 16px; font-size: 16px; font-family: inherit; color: var(--ink); outline: none;
  }
  input:focus { border-color: var(--teal); }
  input::placeholder { color: rgba(110, 109, 108, 0.7); }
  .btn-primary {
    margin-top: 4px; width: 100%; border: 4px solid var(--ink); background: var(--ink); color: var(--cream);
    border-radius: 16px; padding: 12px 20px; font-size: 16px; font-weight: 900; font-family: inherit; cursor: pointer;
  }
  .btn-primary:hover { transform: translateY(-2px); }
  .divider { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; color: var(--gray); }
  .divider::before, .divider::after { content: ""; height: 2px; flex: 1; border-radius: 2px; background: rgba(23, 42, 50, 0.1); }
  .btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    border: 3px solid var(--ink); background: #fff; border-radius: 16px;
    padding: 12px 20px; font-size: 16px; font-weight: 900; font-family: inherit; cursor: pointer; color: var(--ink);
  }
  .btn-google:hover { transform: translateY(-2px); }
  .g-dot {
    width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid var(--ink); background: var(--cream); border-radius: 50%;
    font-size: 14px; font-weight: 900; color: var(--coral);
  }
  .switch { margin-top: 24px; text-align: center; font-size: 16px; }
  .switch button {
    background: none; border: none; font: inherit; font-weight: 900; color: var(--coral);
    text-decoration: underline; text-underline-offset: 4px; cursor: pointer;
  }
  footer { position: relative; z-index: 1; margin-top: 24px; max-width: 448px; text-align: center; font-size: 16px; color: var(--gray); }
</style>
</head>
<body>
  <div class="blob blob-teal"></div>
  <div class="blob blob-coral"></div>

  <header>
    <div class="wordmark">
      <img src="setuai-logo.webp" alt="SetuAI logo" width="48" height="48" class="logo-img" />
      <span class="name">SetuAI</span>
    </div>
    <p class="tagline">The Next Step in AI Literacy</p>
  </header>

  <main>
    <h1 id="heading">Create your account</h1>
    <p class="sub" id="subheading">Join the adventure — it takes less than a minute.</p>
    <form onsubmit="return false;">
      <label>Email
        <input type="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label>Password
        <input type="password" placeholder="••••••••" autocomplete="new-password" id="pw" />
      </label>
      <button class="btn-primary" type="submit">Continue</button>
      <div class="divider">or</div>
      <button class="btn-google" type="button"><span class="g-dot">G</span>Continue with Google</button>
    </form>
    <p class="switch"><span id="switchText">Already playing? </span><button id="switchBtn" onclick="toggleMode()">Log in</button></p>
  </main>

  <footer>Master AI through games, quizzes, and more</footer>

<script>
  let signup = true;
  function toggleMode() {
    signup = !signup;
    document.getElementById('heading').textContent = signup ? 'Create your account' : 'Welcome back';
    document.getElementById('subheading').textContent = signup
      ? 'Join the adventure — it takes less than a minute.'
      : 'Pick up right where your last quest left off.';
    document.getElementById('switchText').textContent = signup ? 'Already playing? ' : 'New here? ';
    document.getElementById('switchBtn').textContent = signup ? 'Log in' : 'Sign up';
    document.getElementById('pw').autocomplete = signup ? 'new-password' : 'current-password';
  }
</script>
</body>
</html>
