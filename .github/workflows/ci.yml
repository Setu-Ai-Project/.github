name: SetuAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite://"
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          CLERK_AUTHORIZED_PARTIES: http://localhost:3000
        run: |
          cd backend
          python -m pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/gamifiedsetu/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend/gamifiedsetu
          npm ci

      - name: Build Next.js App
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy_key
          CLERK_SECRET_KEY: sk_test_dummy_key
        run: |
          cd frontend/gamifiedsetu
          npm run build
